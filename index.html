<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leticia's Boutique</title>
  <style>
    :root {
      --bg: #faf7f4;
      --white: #ffffff;
      --text: #3a2c25;
      --muted: #7a695e;
      --brown: #4d392f;
      --brown-hover: #382820;
      --promo: #5a4439;
      --border: #e6ddd5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    button, input {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .view { display: none; }
    .view.active { display: block; }

    /* Top Promo Bar */
    .promo-bar {
      background: var(--promo);
      color: #f7f1ec;
      font-style: italic;
      font-size: 12px;
      padding: 6px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Header */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 12px 28px 10px;
    }

    .header-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }

    .search-wrap {
      position: relative;
      max-width: 195px;
      width: 100%;
    }

    .search-wrap input {
      width: 100%;
      padding: 6px 10px 6px 28px;
      border: 1px solid #dfd5cc;
      border-radius: 3px;
      background: #fdfcfb;
      font-family: system-ui, sans-serif;
      font-size: 11px;
    }

    .search-wrap span {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--muted);
    }

    .brand {
      font-size: clamp(24px, 3vw, 32px);
      font-weight: normal;
      text-align: center;
    }

    .header-icons {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 14px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      gap: 26px;
      margin-top: 6px;
      font-size: 13px;
    }

    .nav-links button {
      padding-bottom: 2px;
      border-bottom: 1.5px solid transparent;
    }

    .nav-links button:hover,
    .nav-links button.active {
      border-bottom-color: var(--brown);
    }

    /* Hero Banner */
    .hero {
      position: relative;
      width: 100%;
      height: 400px;
      background: #e4d3c3;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 7%;
      overflow: hidden;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 340px;
    }

    .hero-content h1 {
      font-size: clamp(36px, 4.5vw, 52px);
      line-height: 1.05;
      font-weight: normal;
      color: #35261f;
      margin-bottom: 8px;
    }

    .hero-content .tagline {
      font-family: system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #665449;
      margin-bottom: 18px;
    }

    .btn-boutique {
      background: var(--brown);
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      padding: 10px 20px;
      display: inline-block;
    }

    .btn-boutique:hover {
      background: var(--brown-hover);
    }

    /* Page Container */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 24px 56px;
    }

    /* 3 Category Cards */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 42px;
    }

    .cat-card {
      position: relative;
      height: 175px;
      background: #d8c3b0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .cat-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cat-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(38, 26, 20, 0.25);
    }

    .cat-card h3,
    .cat-card span {
      position: relative;
      z-index: 2;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
    }

    .cat-card h3 {
      font-size: 23px;
      font-weight: normal;
      margin-bottom: 4px;
    }

    .cat-card span {
      font-family: system-ui, sans-serif;
      font-size: 9px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    /* Shop Our Favorites */
    .section-title {
      text-align: center;
      margin-bottom: 26px;
    }

    .section-title h2 {
      font-size: 28px;
      font-weight: normal;
      margin-bottom: 4px;
    }

    .section-title p {
      font-style: italic;
      font-size: 13px;
      color: var(--muted);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .product-card {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .product-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f4f1ee;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-name {
      font-size: 13px;
      margin-bottom: 3px;
    }

    .product-price {
      font-family: system-ui, sans-serif;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .add-cart-btn {
      background: var(--brown);
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 9px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      padding: 7px 16px;
      min-width: 114px;
    }

    .add-cart-btn:hover {
      background: var(--brown-hover);
    }

    /* Sub Views (Categories, Bag & Payment Method) */
    .panel {
      background: var(--white);
      border: 1px solid var(--border);
      padding: 28px;
      margin-top: 12px;
    }

    .back-btn {
      font-family: system-ui, sans-serif;
      font-size: 12px;
      color: var(--muted);
      text-decoration: underline;
      margin-bottom: 12px;
      display: inline-block;
    }

    .bag-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-family: system-ui, sans-serif;
      font-size: 13px;
    }

    .qty-ctrl {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      padding: 2px 8px;
      background: var(--bg);
    }

    .checkout-cols {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 28px;
      margin-top: 16px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .field label {
      font-size: 11px;
      color: var(--muted);
    }

    .field input {
      padding: 9px 11px;
      border: 1px solid #dfd5cc;
      background: #fdfcfb;
      font-size: 13px;
    }

    .pm-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 12px 0;
    }

    .pm-btn {
      border: 1px solid var(--border);
      background: #fdfcfb;
      padding: 10px 12px;
      text-align: left;
      font-size: 12px;
    }

    .pm-btn.active {
      border-color: var(--brown);
      background: #f4ece5;
      font-weight: 600;
    }

    .pm-box {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 14px;
      margin-bottom: 14px;
    }

    .summary-box {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 18px;
    }

    @media (max-width: 820px) {
      .header-top { grid-template-columns: 1fr; text-align: center; }
      .search-wrap { max-width: 100%; }
      .header-icons { justify-content: center; }
      .hero { height: 300px; justify-content: center; padding: 24px; }
      .category-grid { grid-template-columns: 1fr; }
      .products-grid { grid-template-columns: repeat(2, 1fr); }
      .checkout-cols { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Promo Bar -->
  <div class="promo-bar">
    <span>&lsaquo;</span>
    <span>Free shipping on orders over $75</span>
    <span>&rsaquo;</span>
  </div>

  <!-- Header -->
  <header>
    <div class="header-top">
      <div class="search-wrap">
        <span>&#128269;</span>
        <input type="search" id="searchInput" placeholder="Search..." />
      </div>

      <button type="button" class="brand" data-view="home">Leticia's Boutique</button>

      <div class="header-icons">
        <button type="button" title="Account">&#128100;</button>
        <button type="button" id="bagBtn" data-view="bag" title="Bag">
          &#128717; <span id="bagCount">0</span>
        </button>
      </div>
    </div>

    <nav class="nav-links">
      <button type="button" data-view="jewelry">Jewelry</button>
      <button type="button" data-view="fajas">Fajas</button>
      <button type="button" data-view="perfume">Perfume</button>
    </nav>
  </header>

  <!-- HOMEPAGE -->
  <main id="view-home" class="view active">
    <section class="hero">
      <!-- Replace with your hero image file path -->
      <img src="images/hero.jpg" alt="Leticia's Boutique" />
      <div class="hero-content">
        <h1>Leticia's<br>Boutique</h1>
        <div class="tagline">LUXURY &bull; BEAUTY &bull; STYLE</div>
        <button type="button" class="btn-boutique" data-view="fajas">SHOP NOW &rarr;</button>
      </div>
    </section>

    <div class="container">
      <!-- 3 Category Tiles -->
      <section class="category-grid">
        <button type="button" class="cat-card" data-view="jewelry">
          <!-- Replace with your jewelry category image -->
          <img src="images/jewelry-cat.jpg" alt="Jewelry" />
          <h3>Jewelry</h3>
          <span>SHOP NOW &rarr;</span>
        </button>

        <button type="button" class="cat-card" data-view="fajas">
          <!-- Replace with your fajas category image -->
          <img src="images/fajas-cat.jpg" alt="Fajas" />
          <h3>Fajas</h3>
          <span>SHOP NOW &rarr;</span>
        </button>

        <button type="button" class="cat-card" data-view="perfume">
          <!-- Replace with your perfume category image -->
          <img src="images/perfume-cat.jpg" alt="Perfume" />
          <h3>Perfume</h3>
          <span>SHOP NOW &rarr;</span>
        </button>
      </section>

      <!-- Shop Our Favorites -->
      <section>
        <div class="section-title">
          <h2>Shop Our Favorites</h2>
          <p>Elevate your everyday with our most loved pieces.</p>
        </div>

        <div class="products-grid" id="favoritesGrid"></div>
      </section>
    </div>
  </main>

  <!-- JEWELRY / FAJAS / PERFUME VIEWS -->
  <section id="view-jewelry" class="view">
    <div class="container">
      <button type="button" class="back-btn" data-view="home">&larr; Back to Home</button>
      <div class="panel"><h2 style="font-weight:normal;">Jewelry Collection</h2></div>
    </div>
  </section>

  <section id="view-fajas" class="view">
    <div class="container">
      <button type="button" class="back-btn" data-view="home">&larr; Back to Home</button>
      <div class="panel"><h2 style="font-weight:normal;">Fajas Collection</h2></div>
    </div>
  </section>

  <section id="view-perfume" class="view">
    <div class="container">
      <button type="button" class="back-btn" data-view="home">&larr; Back to Home</button>
      <div class="panel"><h2 style="font-weight:normal;">Perfume Collection</h2></div>
    </div>
  </section>

  <!-- BAG VIEW -->
  <section id="view-bag" class="view">
    <div class="container">
      <button type="button" class="back-btn" data-view="home">&larr; Continue Shopping</button>
      <div class="panel" id="bagBox"></div>
    </div>
  </section>

  <!-- PAYMENT METHOD VIEW -->
  <section id="view-payment" class="view">
    <div class="container">
      <button type="button" class="back-btn" data-view="bag">&larr; Back to Bag</button>
      <div class="panel" id="paymentBox"></div>
    </div>
  </section>

  <script>
    const favorites = [
      { id: "cartier", name: "Cartier Love Bracelet", price: 6750.00, img: "images/cartier.jpg" },
      { id: "dior", name: "Miss Dior Eau de Parfum", price: 145.00, img: "images/miss-dior.jpg" },
      { id: "faja", name: "Faja Colombiana", price: 69.99, img: "images/faja.jpg" },
      { id: "vancleef", name: "Van Cleef Necklace", price: 2350.00, img: "images/van-cleef.jpg" }
    ];

    let bag = [];
    let selectedMethod = "card";

    const money = n => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function showView(name) {
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      const target = document.getElementById("view-" + name);
      if (target) target.classList.add("active");
      if (name === "bag") renderBag();
      if (name === "payment") renderPayment();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderFavorites(query = "") {
      const q = query.trim().toLowerCase();
      const filtered = favorites.filter(p => !q || p.name.toLowerCase().includes(q));
      document.getElementById("favoritesGrid").innerHTML = filtered.map(p => `
        <div class="product-card">
          <div class="product-img-wrap">
            <img src="${p.img}" alt="${p.name}" />
          </div>
          <div class="product-name">${p.name}</div>
          <div class="product-price">${money(p.price)}</div>
          <button type="button" class="add-cart-btn" onclick="addToBag('${p.id}')">ADD TO CART</button>
        </div>
      `).join("");
    }

    function addToBag(id) {
      const item = favorites.find(p => p.id === id);
      if (!item) return;
      const found = bag.find(i => i.id === id);
      if (found) found.qty += 1;
      else bag.push({ ...item, qty: 1 });
      document.getElementById("bagCount").textContent = bag.reduce((s, i) => s + i.qty, 0);
    }

    function updateQty(id, delta) {
      const item = bag.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) bag = bag.filter(i => i.id !== id);
      document.getElementById("bagCount").textContent = bag.reduce((s, i) => s + i.qty, 0);
      renderBag();
    }

    function renderBag() {
      const box = document.getElementById("bagBox");
      if (!bag.length) {
        box.innerHTML = `<h2 style="font-weight:normal;">Your Bag</h2><p style="margin-top:8px; color:var(--muted);">Your bag is empty.</p>`;
        return;
      }
      const subtotal = bag.reduce((s, i) => s + i.price * i.qty, 0);
      const shipping = subtotal >= 75 ? 0 : 6.99;
      const total = subtotal + shipping;

      box.innerHTML = `
        <h2 style="font-weight:normal; margin-bottom:10px;">Your Shopping Bag</h2>
        ${bag.map(i => `
          <div class="bag-item">
            <div><strong>${i.name}</strong><br><span style="color:var(--muted); font-size:12px;">${money(i.price)}</span></div>
            <div style="display:flex; align-items:center; gap:12px;">
              <div class="qty-ctrl">
                <button type="button" onclick="updateQty('${i.id}', -1)">-</button>
                <span>${i.qty}</span>
                <button type="button" onclick="updateQty('${i.id}', 1)">+</button>
              </div>
              <strong>${money(i.price * i.qty)}</strong>
            </div>
          </div>
        `).join("")}
        <div style="max-width:320px; margin-left:auto; margin-top:16px; font-family:system-ui, sans-serif; font-size:13px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:6px;"><span>Subtotal</span><span>${money(subtotal)}</span></div>
          <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>Shipping</span><span>${shipping === 0 ? "FREE" : money(shipping)}</span></div>
          <div style="display:flex; justify-content:space-between; font-weight:700; font-size:15px; padding-top:8px; border-top:1px solid var(--border);"><span>Total</span><span>${money(total)}</span></div>
          <button type="button" class="btn-boutique" style="width:100%; text-align:center; margin-top:14px;" onclick="showView('payment')">PROCEED TO CHECKOUT &rarr;</button>
        </div>
      `;
    }

    function setMethod(m) {
      selectedMethod = m;
      renderPayment();
    }

    function renderPayment() {
      const box = document.getElementById("paymentBox");
      if (!bag.length) return showView("bag");

      const subtotal = bag.reduce((s, i) => s + i.price * i.qty, 0);
      const shipping = subtotal >= 75 ? 0 : 6.99;
      const total = subtotal + shipping;

      const methodDetails = {
        card: `
          <div class="field"><label>Name on Card</label><input type="text" required placeholder="Full name" /></div>
          <div class="field"><label>Card Number</label><input type="text" inputmode="numeric" required placeholder="1234 5678 9012 3456" /></div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="field"><label>MM/YY</label><input type="text" required placeholder="09/28" /></div>
            <div class="field"><label>CVC</label><input type="text" required placeholder="123" /></div>
          </div>`,
        applepay: `<p style="font-size:12px; color:var(--muted);">Authorize <strong>${money(total)}</strong> with Apple Pay.</p>`,
        paypal: `<div class="field"><label>PayPal Email</label><input type="email" required placeholder="you@example.com" /></div>`,
        klarna: `<p style="font-size:12px;">4 interest-free payments of <strong>${money(total / 4)}</strong>.</p>`
      }[selectedMethod];

      box.innerHTML = `
        <h2 style="font-weight:normal; margin-bottom:4px;">Payment Method</h2>
        <p style="font-style:italic; font-size:13px; color:var(--muted);">Complete your order at Leticia's Boutique.</p>
        <div class="checkout-cols">
          <form onsubmit="finishOrder(event, ${total})">
            <div class="field"><label>Full Name</label><input id="custName" type="text" required placeholder="Your full name" /></div>
            <div class="field"><label>Email</label><input id="custEmail" type="email" required placeholder="you@example.com" /></div>
            <div class="field"><label>Shipping Address</label><input type="text" required placeholder="Street, City, State, ZIP" /></div>

            <div class="pm-grid">
              <button type="button" class="pm-btn ${selectedMethod === 'card' ? 'active' : ''}" onclick="setMethod('card')">Credit / Debit Card</button>
              <button type="button" class="pm-btn ${selectedMethod === 'applepay' ? 'active' : ''}" onclick="setMethod('applepay')">Apple Pay</button>
              <button type="button" class="pm-btn ${selectedMethod === 'paypal' ? 'active' : ''}" onclick="setMethod('paypal')">PayPal</button>
              <button type="button" class="pm-btn ${selectedMethod === 'klarna' ? 'active' : ''}" onclick="setMethod('klarna')">4 Interest-Free Payments</button>
            </div>

            <div class="pm-box">${methodDetails}</div>
            <button type="submit" class="btn-boutique" style="width:100%; text-align:center;">PAY ${money(total)} &rarr;</button>
          </form>

          <div class="summary-box">
            <div style="font-family:Georgia, serif; font-size:16px; margin-bottom:10px;">Order Summary</div>
            ${bag.map(i => `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:12px;"><span>${i.name} &times; ${i.qty}</span><strong>${money(i.price * i.qty)}</strong></div>`).join("")}
            <div style="display:flex; justify-content:space-between; margin-top:10px; font-weight:700;"><span>Total</span><span>${money(total)}</span></div>
          </div>
        </div>
      `;
    }

    function finishOrder(e, total) {
      e.preventDefault();
      const name = document.getElementById("custName").value.trim();
      const email = document.getElementById("custEmail").value.trim();
      bag = [];
      document.getElementById("bagCount").textContent = "0";
      document.getElementById("paymentBox").innerHTML = `
        <h2 style="font-weight:normal; margin-bottom:8px;">Thank You, ${name}</h2>
        <p style="font-style:italic; color:var(--muted); margin-bottom:16px;">Your payment of ${money(total)} is confirmed. Receipt sent to ${email}.</p>
        <button type="button" class="btn-boutique" onclick="showView('home')">BACK TO HOME &rarr;</button>
      `;
    }

    document.querySelectorAll("[data-view]").forEach(btn => {
      btn.addEventListener("click", () => showView(btn.dataset.view));
    });
    document.getElementById("searchInput").addEventListener("input", e => renderFavorites(e.target.value));
    renderFavorites();
  </script>
</body>
</html>
